server.port=8081
spring.application.name=CareerMatcher
spring.neo4j.uri=${AURA_URI}
spring.neo4j.authentication.username=${AURA_USER}
spring.neo4j.authentication.password=${AURA_PASSWORD}

spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=${EMAIL_ME}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


storage.r2.endpoint=${R2_ENDPOINT:}
storage.r2.bucket=${R2_BUCKET:}
storage.r2.access-key=${R2_ACCESS_KEY_ID:}
storage.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
storage.r2.attempt-timeout=${R2_ATTEMPT_TIMEOUT:30s}
matching.execution.compression=${MATCHING_EXECUTION_COMPRESSION:gzip}
# Maximum IDs per Neo4j query when loading matching participants and their relationships.
matching.selection.batch-size=${MATCHING_SELECTION_BATCH_SIZE:200}
# In-memory execution only: accepted jobs are not recovered after a restart.
matching.async.workers=${MATCHING_ASYNC_WORKERS:1}
matching.async.queue-capacity=${MATCHING_ASYNC_QUEUE_CAPACITY:20}

auth.issuer=${AUTH_ISSUER:talentengine}
auth.private-key=${AUTH_PRIVATE_KEY:}
auth.public-key=${AUTH_PUBLIC_KEY:}
auth.frontend-url=${FRONTEND_URL:http://localhost:5500}
auth.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5501,http://localhost:4200}
auth.invitation-ttl=${INVITATION_TTL:24h}
reports.base-url=${REPORTS_BASE_URL:http://localhost:8000}

# Disabled outside the VPS. The host owns this directory; containers mount it read-only.
deployment.control-directory=${DEPLOY_CONTROL_DIRECTORY:}
deployment.control-token=${DEPLOY_CONTROL_TOKEN:}

# Assisted form filling: PDFs are transient and only extracted text is sent to DeepSeek.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=0
ai.extraction.enabled=${AI_EXTRACTION_ENABLED:false}
ai.extraction.max-pdf-bytes=${AI_EXTRACTION_MAX_PDF_BYTES:5242880}
ai.extraction.max-pages=${AI_EXTRACTION_MAX_PAGES:20}
ai.extraction.max-text-characters=${AI_EXTRACTION_MAX_TEXT_CHARACTERS:60000}
ai.extraction.max-concurrent=${AI_EXTRACTION_MAX_CONCURRENT:2}
ai.extraction.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.extraction.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.extraction.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
ai.extraction.deepseek.connect-timeout=${DEEPSEEK_CONNECT_TIMEOUT:5s}
ai.extraction.deepseek.read-timeout=${DEEPSEEK_READ_TIMEOUT:60s}
ai.extraction.deepseek.max-output-tokens=${DEEPSEEK_MAX_OUTPUT_TOKENS:8192}
