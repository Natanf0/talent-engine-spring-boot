# Install as /etc/nginx/sites-available/talentengine-api and enable the site.
# Certbot --nginx adds the HTTPS listener and HTTP redirect after DNS is ready.
log_format talentengine
    '$remote_addr [$time_local] "$request_method $uri" '
    '$status upstream=$upstream_addr rt=$request_time';

# Shared across both Spring upstreams. Excess requests return 429 before reaching the paid API.
limit_req_zone $binary_remote_addr zone=ai_extraction:10m rate=10r/m;

upstream talentengine_spring {
    least_conn;
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.talentengine.com.br;
    server_tokens off;
    client_max_body_size 10m;

    access_log /var/log/nginx/talentengine.access.log talentengine;
    error_log /var/log/nginx/talentengine.error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Replace client-supplied forwarding headers before Spring processes them.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 110s;
    proxy_read_timeout 110s;
    # Do not enable non_idempotent: a submitted POST must not be replayed.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    location ~ ^/api/(me/candidate|careermatcher/vagas)/ai-extraction$ {
        client_max_body_size 6m;
        limit_req zone=ai_extraction burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://talentengine_spring;
    }

    location /api/ {
        # No trailing slash: preserve the /api/ prefix expected by Spring.
        proxy_pass http://talentengine_spring;
    }

    location = /healthz {
        proxy_pass http://talentengine_spring/actuator/health;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
